name: Deploy to Production

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        # TODO: Configure docker registry credentials
        # username: ${{ secrets.DOCKER_USERNAME }}
        # password: ${{ secrets.DOCKER_PASSWORD }}
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./app
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/sentiment-api:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}/sentiment-api:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/sentiment-api:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/sentiment-api:buildcache,mode=max
    
    - name: Generate deployment artifacts
      run: |
        echo "Release: ${{ github.ref_name }}" > release_info.txt
        echo "Build timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> release_info.txt
    
    - name: Upload deployment info
      uses: actions/upload-artifact@v3
      with:
        name: deployment-info
        path: release_info.txt

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to staging environment
      run: |
        # TODO: Deploy to staging
